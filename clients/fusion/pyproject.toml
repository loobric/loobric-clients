[project]
name = "loobric-fusion"
version = "0.1.0"
description = "Loobric client for Autodesk Fusion tool libraries (.tools) — bidirectional tool and cutting-data-preset sync."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "sliptonic" }]
keywords = ["cnc", "cam", "tool-data", "fusion360", "machining"]
classifiers = [
      "Development Status :: 3 - Alpha",
      "License :: OSI Approved :: MIT License",
      "Programming Language :: Python :: 3",
      "Topic :: Scientific/Engineering",
      "Intended Audience :: Manufacturing"]
# The client library (loobric-cli's `loobric` package) is stdlib-only; this is
# the one dependency and it is deliberate — client verbs are added THERE first.
dependencies = ["loobric-cli>=1.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
loobric-fusion = "loobric_fusion.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loobric_fusion*"]

[project.urls]
Homepage = "https://github.com/loobric/loobric-fusion"
Repository = "https://github.com/loobric/loobric-fusion"
Issues = "https://github.com/loobric/loobric-fusion/issues"
